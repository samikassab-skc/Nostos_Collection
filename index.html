<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#001b44">
<title>Nostos Collection</title>

<link rel="manifest" href="./manifest.json">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  color:white;

  background:
    linear-gradient(
      rgba(0,18,58,0.55),
      rgba(0,18,58,0.80)
    ),
    url("./photo.jpg");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.container{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:28px;
}

.badge{
  display:inline-block;
  align-self:flex-start;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(255,215,120,.15);
  border:1px solid rgba(255,215,120,.4);
  color:#ffd890;
  font-weight:600;
  letter-spacing:.5px;
}

.hero{
  margin-top:24px;
}

.hero h1{
  font-size:2.4rem;
  line-height:1.1;
  margin-bottom:14px;
  max-width:650px;
}

.hero p{
  color:#e5e7eb;
  font-size:1.05rem;
  line-height:1.6;
  max-width:650px;
}

.services{
  display:grid;
  gap:12px;
  margin-top:32px;
}

.service-btn{
  border:none;
  border-radius:18px;
  padding:18px;
  font-size:1rem;
  cursor:pointer;
  text-align:left;
  transition:.25s ease;
  backdrop-filter:blur(10px);
}

.service-btn:hover{
  transform:translateY(-2px);
}

.primary{
  background:white;
  color:#001b44;
  font-weight:700;
}

.secondary{
  background:rgba(255,255,255,.15);
  color:white;
  border:1px solid rgba(255,255,255,.15);
}

.footer{
  text-align:center;
  color:rgba(255,255,255,.75);
  font-size:.85rem;
  margin-top:20px;
}

@media (min-width:768px){

  .container{
    max-width:900px;
    margin:auto;
  }

  .services{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="container">

<div>
  <div class="badge">NOSTOS COLLECTION</div>

  <section class="hero">
    <h1>Bienvenue dans votre expérience exclusive</h1>

    <p>
      Profitez pleinement de votre séjour grâce à notre sélection de
      services premium et à notre concierge intelligent disponible
      à tout moment.
    </p>
  </section>
</div>

<section class="services">

  <button class="service-btn secondary">
    🤖 Concierge IA
  </button>

  <button
    class="service-btn secondary"
    onclick="window.location.href='chef-a-domicile.html'">
    🍽️ Chef à domicile
</button>

 <button
  class="service-btn secondary"
  onclick="window.location.href='degustation-vin.html'">
  🍷 Dégustation de vin à domicile
</button>

<button
    class="service-btn secondary"
    onclick="window.location.href='bien-etre-soins.html'">
    💆 Bien-être et Soins
</button>

  <button class="service-btn secondary">
    🧺 Achats de produits locaux
  </button>

  <button class="service-btn secondary">
    🌄 Découverte de la Région
  </button>

</section>

<div class="footer">

  <img
    src="./icon-192.png"
    alt="Nostos Collection"
    class="footer-logo"
  >

  <div class="footer-text">
    Nostos Collection • Créateur de souvenirs mémorables.
  </div>

</div>

</div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./sw.js")
      .then(() => console.log("Service Worker enregistré"))
      .catch((err) => console.error(err));
  });
}
</script>

</body>
</html>
